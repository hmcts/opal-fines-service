openapi: 3.1.1

servers:
  - url: http://localhost:4550/

info:
  description: Opal File Handler Service - Test Support Endpints
  version: v0.0.1
  title: Opal File Handler Service

paths:
  /testing-support/automated-jobs/{name}:
    post:
      tags:
        - Test Support
      summary: Run automated Job
      description: Runs an automated job with the provided name
      parameters:
        - in: path
          name: name
          description: The name of the job to run
          schema:
            type: string
          required: true
      responses:
        '202':
          description: Job triggered successfully
        400:
          description: Bad request
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        401:
          description: Unauthorized
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        403:
          description: Forbidden
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        404:
          description: Not Found
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        500:
          description: Internal server error
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        503:
          description: Service unavailable
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
  /testing-support/interface-files:
    delete:
      tags:
        - Test Support
      summary: Delete interface files
      description: Deletes the SOURCE interface files specified and all related files.
      parameters:
        - in: query
          name: ids
          description: The ids of the SOURCE interface file to delete
          schema:
            type: array
            items:
              type: integer
              format: int64
          required: true
      responses:
        200:
          description: All interface files successfully deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/deleteInterfaceFilesResult'
        207:
          description: Some interface files successfully deleted, some failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/deleteInterfaceFilesResult'
        400:
          description: Bad request
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        401:
          description: Unauthorized
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        403:
          description: Forbidden
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        404:
          description: Not Found
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        500:
          description: Internal server error
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        503:
          description: Service unavailable
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
components:
  schemas:
    deleteInterfaceFilesResult:
      title: Delete Interface Files Response (TESTING ONLY)
      additionalProperties: false
      type: object
      required:
        - successfullyDeletedIds
        - failedIds
      properties:
        successfully_deleted_ids:
          type: array
          description: List of SOURCE interface ids that were successfully deleted
          items:
            type: integer
            format: int64
        failed_ids:
          type: array
          description: List of SOURCE interface ids where an error occurred
          items:
            type: integer
            format: int64