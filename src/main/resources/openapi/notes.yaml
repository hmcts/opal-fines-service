openapi: 3.1.1
info:
  title: Opal Fines Service - Notes
  version: 1.0.0
  description: APIs for managing notes.
paths:
  /notes:
    post:
      tags:
        - notes
      summary: Add a note to an entity
      description: >-
        Suspense item notes require Manage Suspense Items permission in the supplied business unit
        and the release-1c-suspense feature flag. Existing account notes require Add account activity notes.
      operationId: addNote
      parameters:
        - in: header
          name: Business-Unit-Id
          description: Business unit identifier
          required: true
          schema:
            type: integer
            format: int16
        - in: header
          name: If-Match
          description: >-
            Version of the associated defendant account, creditor account or suspense item.
            An uninitialised suspense item version is treated as 0.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddNoteRequest'
      responses:
        "201":
          description: Note created
          content:
            application/json:
              schema:
                type: string
        "400":
          description: Bad request
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        "401":
          description: Unauthorized
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        "403":
          description: Forbidden
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        "404":
          description: Associated record not found or feature disabled
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        "409":
          description: Associated record version does not match If-Match
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        "500":
          description: Internal server error
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        "503":
          description: Service unavailable
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AddNoteRequest:
      additionalProperties: false
      type: object
      x-json-include: NON_NULL
      x-implements:
        - uk.gov.hmcts.opal.dto.ToJsonString
      required:
        - activity_note
      properties:
        activity_note:
          $ref: './common.yaml#/components/schemas/note'
