openapi: 3.1.1

servers:
  - url: http://localhost:4550/

info:
  description: Opal Fines Service - Tills
  version: v0.0.1
  title: Opal Fines Service

paths:
  /tills:
    post:
      tags:
        - tills
      summary: Add till
      description: |
        Create a till containing one or more payments using the coded values returned by Get Mappings.
        Criminal payments require a defendant account in the submitted business unit. Criminal third-party
        payments require only third_party_payer_name for the payer; structured payer information is prohibited.
        Court Fee and identified Suspense payments (OF, FA, MS) require a payer type and matching name structure.
        Unidentified Suspense (UN) permits an absent payer. Payer addresses are optional in every permitted shape.
        Credit Transfer requires transfer_source; payment_reference is optional for every method.
        Payer identity is persisted in a Party through a Miscellaneous Account, separately from allocation metadata.
      operationId: post_tills
      security:
        - permissions:
            - Process and Allocate Payments in (in the submitted business unit)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TillsCreateRequest'
      responses:
        "201":
          description: Till created
        "400":
          description: Bad request
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        "401":
          description: Unauthorized
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        "403":
          description: Forbidden
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        "406":
          description: Not Acceptable
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        "408":
          description: Request timeout
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        "415":
          description: Unsupported media type
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        "500":
          description: Internal server error
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        "503":
          description: Service unavailable
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
    get:
      tags:
        - tills
      summary: Get tills
      operationId: get_tills
      description: Get list of tills filtered by business unit, status and auto-payments
      security:
        - permissions:
            - Process and Allocate Payments in (in the retrieved business unit)
      parameters:
        - in: query
          name: statuses
          schema:
            type: array
            minItems: 1
            items:
              type: string
              enum: [ CREATED, PROCESSING, FAILED, ALLOCATED ]
        - in: query
          name: auto_payments
          schema:
            type: boolean
        - in: query
          name: business_unit_ids
          schema:
            type: array
            minItems: 1
            items:
              type: integer
              format: int16
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TillsResponse'

        "400":
          description: Bad request
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        "401":
          description: Unauthorized
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        "403":
          description: Forbidden
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        "500":
          description: Internal server error
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        "503":
          description: Service unavailable
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
  /tills/allocate:
    post:
      tags:
        - tills
      summary: Allocate tills
      operationId: allocate_tills
      description: Allocate a list of tills by ID asynchronously.
      security:
        - permissions:
            - Process and Allocate Payments in the business unit provided for each till
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TillsAllocateRequest'
      responses:
        "200":
          description: OK
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        "404":
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        "408":
          description: Request timeout
          content:
            application/problem+json:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        "409":
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        "503":
          description: Service unavailable
          content:
            application/problem+json:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'

  /tills/{id}:
    get:
      tags:
        - tills
      summary: Get till
      operationId: get_till
      description: Get a till and its payments in by till ID
      security:
        - permissions:
            - Process and Allocate Payments within the Business Unit context
      parameters:
        - name: id
          in: path
          required: true
          description: Till ID
          schema:
            $ref: './types.yaml#/components/schemas/BigInt'
      responses:
        "200":
          description: Till response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TillsGetResponse'
        "400":
          description: Bad request
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        "401":
          description: Unauthorized
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        "403":
          description: Forbidden
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        "404":
          description: Till not found
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        "500":
          description: Internal server error
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        "503":
          description: Service unavailable
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'

components:
  schemas:
    TillsCreateRequest:
      type: object
      additionalProperties: false
      required: [business_unit_id, payments_in]
      properties:
        business_unit_id:
          $ref: './types.yaml#/components/schemas/BusinessUnitId'
        payments_in:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TillsCreatePaymentIn'
    TillsCreatePaymentIn:
      type: object
      additionalProperties: false
      required: [payment_details, additional_information]
      properties:
        defendant_account_id:
          $ref: './types.yaml#/components/schemas/BigInt'
          description: Required only for F; must identify an existing defendant account in the submitted business unit.
        payment_details:
          $ref: '#/components/schemas/TillsCreatePaymentDetails'
        additional_information:
          $ref: '#/components/schemas/TillsCreateAdditionalInformation'
      allOf:
        - if:
            properties:
              payment_details:
                properties:
                  destination_type:
                    const: F
          then:
            required: [defendant_account_id]
            properties:
              additional_information:
                properties:
                  payment_received_from:
                    enum: [D, T]
                not:
                  anyOf:
                    - required: [payer_type]
                    - required: [payer_details]
                    - required: [court_fee_code]
                    - required: [number_of_items]
                    - required: [suspense_reason_code]
                    - required: [suspense_reason_detail]
                    - required: [suspense_note]
                if:
                  properties:
                    payment_received_from:
                      const: T
                then:
                  required: [third_party_payer_name]
        - if:
            properties:
              payment_details:
                properties:
                  destination_type:
                    const: C
          then:
            not:
              required: [defendant_account_id]
            properties:
              additional_information:
                required: [court_fee_code, number_of_items, suspense_note, payer_type, payer_details]
                properties:
                  payment_received_from:
                    enum: [A, T]
                not:
                  anyOf:
                    - required: [suspense_reason_code]
                    - required: [suspense_reason_detail]
        - if:
            properties:
              payment_details:
                properties:
                  destination_type:
                    const: S
          then:
            not:
              required: [defendant_account_id]
            properties:
              additional_information:
                required: [suspense_reason_code, suspense_note]
                not:
                  anyOf:
                    - required: [court_fee_code]
                    - required: [number_of_items]
                if:
                  properties:
                    suspense_reason_code:
                      enum: [OF, FA, MS]
                then:
                  required: [payer_type, payer_details]
                  not:
                    required: [suspense_reason_detail]
        - if:
            properties:
              payment_details:
                properties:
                  method:
                    const: CT
          then:
            properties:
              additional_information:
                required: [transfer_source]
    TillsCreatePaymentDetails:
      type: object
      additionalProperties: false
      required: [amount, method, destination_type, allocation_type]
      properties:
        amount:
          type: number
          multipleOf: 0.01
          description: DB Mapping - payments_in.payment_amount
        method:
          type: string
          enum: [NC, CQ, CT, PO]
          description: Coded payment method returned by Get Mappings.
        destination_type:
          type: string
          enum: [F, S, C]
          description: Fines (F), Suspense (S) or Court Fee (C).
        allocation_type:
          type: string
          description: Coded allocation category returned by Get Mappings.
    TillsCreateAdditionalInformation:
      description: |
        Per-payment allocation metadata and conditional payer input. Only payment_received_from is globally required.
        Payer type, name and address are mapped to the durable Party and excluded from Payment In additional_information.
        Court Fee and Suspense fields remain available to allocation.
      type: object
      additionalProperties: false
      required: [payment_received_from]
      properties:
        payment_received_from:
          type: string
          enum: [D, A, T]
          description: |
            F permits D or T; C permits A or T; S permits D, A or T.
            Retained in Payment In metadata for allocation.
        third_party_payer_name:
          type: string
          description: |
            Required for F received from T, without structured payer data.
            Stored in payments_in.third_party_payer_name for allocation.
          minLength: 1
          maxLength: 30
        court_fee_code:
          type: string
          minLength: 1
          maxLength: 10
        number_of_items:
          type: integer
          format: int16
          minimum: 1
        payment_reference:
          type: string
          description: |
            Optional for every method. Supplied values are retained in Payment In metadata for allocation.
        transfer_source:
          type: string
          enum: [NATWEST, ALLPAY, BARCLAYCARD, BTECKOH, OTHER, DWP, CDER, JACOBS, MARSTON]
          description: |
            Required for CT and optional for other methods.
            Supplied values are retained in Payment In metadata for allocation.
        suspense_reason_code:
          type: string
          enum: [OF, FA, MS, UN]
        suspense_reason_detail:
          type: string
        suspense_note:
          type: string
          minLength: 1
        payer_type:
          $ref: '#/components/schemas/TillsCreatePayerType'
          description: |
            Required for C and S/OF, FA, MS; optional for S/UN; prohibited for F.
            Used to populate parties.organisation through the associated Miscellaneous Account.
        payer_details:
          $ref: '#/components/schemas/TillsCreatePayerDetails'
          description: |
            Required whenever payer_type is supplied; must contain only the matching name structure.
            Name fields and addresses remain optional. Persisted in Party, excluded from Payment In metadata.
      allOf:
        - if:
            properties:
              payer_type:
                const: Individual
            required: [payer_type]
          then:
            required: [payer_details]
            properties:
              payer_details:
                required: [individual]
        - if:
            properties:
              payer_type:
                const: Organisation
            required: [payer_type]
          then:
            required: [payer_details]
            properties:
              payer_details:
                required: [organisation]
        - if:
            required: [payer_details]
          then:
            required: [payer_type]
    TillsCreatePayerDetails:
      type: object
      additionalProperties: false
      properties:
        address_line_1:
          type: string
          maxLength: 35
        address_line_2:
          type: string
          maxLength: 35
        address_line_3:
          type: string
          maxLength: 35
        postcode:
          type: string
          maxLength: 10
        individual:
          $ref: '#/components/schemas/TillsCreateIndividualPayer'
        organisation:
          $ref: '#/components/schemas/TillsCreateOrganisationPayer'
      oneOf:
        - required:
            - individual
        - required:
            - organisation
    TillsCreateIndividualPayer:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 20
        forenames:
          type: string
          maxLength: 50
        surname:
          type: string
          maxLength: 50
    TillsCreateOrganisationPayer:
      type: object
      additionalProperties: false
      properties:
        organisation_name:
          type: string
          maxLength: 80
    TillsCreatePayerType:
      type: string
      enum:
        - Individual
        - Organisation
    TillsAllocateRequest:
      type: object
      required:
        - tills
      properties:
        tills:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TillsAllocateItem'
    TillsAllocateItem:
      type: object
      required:
        - till_id
        - business_unit_id
      properties:
        till_id:
          $ref: './types.yaml#/components/schemas/BigInt'
        business_unit_id:
          $ref: './types.yaml#/components/schemas/BusinessUnitId'
    TillsResponse:
      type: object
      required:
        - tills
      properties:
        tills:
          type: array
          items:
            $ref: '#/components/schemas/TillsItem'
    TillsItem:
      type: object
      required:
        - till_number
        - errors
        - amount
        - business_unit_name
        - processed_by
      properties:
        till_id:
          type: integer
          format: int64
          description: DB Mapping - v_till_summary.till_id
        till_number:
          type: integer
          format: int16
        errors:
          type: integer
          format: int64
        payments_count:
          type: integer
          format: int16
          description: DB Mapping - v_till_summary.payments_count
        file_name:
          type: string
        source:
          type: string
        amount:
          type: number
          multipleOf: 0.01
        business_unit_name:
          type: string
        processed_by:
          type: string
        date_processed:
          type: string
          format: date

    TillsGetResponse:
      type: object
      additionalProperties: false
      required:
        - till_number
        - business_unit_id
        - created_by
        - created_date
        - payments_in
      properties:
        till_number:
          type: integer
          format: int16
          description: DB Mapping - tills.till_number
        business_unit_id:
          type: integer
          format: int16
          description: DB Mapping - tills.business_unit_id
        created_by:
          type: string
          description: DB Mapping - tills.owned_by_name
        created_date:
          type: string
          format: date-time
          description: DB Mapping - tills.created_date
        payments_in:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TillsPaymentIn'

    TillsPaymentIn:
      type: object
      additionalProperties: false
      required:
        - payment_in_id
        - amount
        - date
        - method
        - destination_type
        - payment_received_from
        - receipt
      properties:
        payment_in_id:
          type: integer
          format: int64
          description: DB Mapping - payments_in.payment_in_id
        associated_record_id:
          type:
            - string
            - 'null'
          maxLength: 30
          description: DB Mapping - payments_in.associated_record_id
        associated_record_type:
          type:
            - string
            - 'null'
          description: DB Mapping - payments_in.associated_record_type
          enum:
            - defendant_accounts
            - creditor_transactions
            - miscellaneous_accounts
            - creditor_accounts
            - suspense_transactions
            - suspense_items
            - enforcements
            - cheques
            - impositions
            - defendant_transactions
            - report_instances
        amount:
          type: number
          multipleOf: 0.01
          description: DB Mapping - payments_in.payment_amount
        date:
          type: string
          format: date-time
          description: DB Mapping - payments_in.payment_date
        method:
          type: string
          description: DB Mapping - payments_in.payment_method
          enum:
            - NC
            - CQ
            - CT
            - PO
        destination_type:
          type: string
          description: DB Mapping - payments_in.destination_type
          enum:
            - F
            - S
            - C
        allocation_type:
          type:
            - string
            - 'null'
          maxLength: 20
          description: DB Mapping - payments_in.allocation_type
        payment_received_from:
          type: string
          description: Derived from payments_in.additional_information.payment_received_from
          enum:
            - D
            - A
            - T
        third_party_payer_name:
          type:
            - string
            - 'null'
          maxLength: 50
          description: DB Mapping - payments_in.third_party_payer_name
        receipt:
          type: boolean
          description: DB Mapping - payments_in.receipt
        defendant_detail:
          description: Provided only when destination_type is F (Fines)
          anyOf:
            - $ref: '#/components/schemas/TillsDefendantDetail'
            - type: 'null'
        payer_name:
          description: Provided only when destination_type is S (Suspense) or C (Court Fee)
          anyOf:
            - $ref: '#/components/schemas/TillsPayerName'
            - type: 'null'

    TillsDefendantDetail:
      type: object
      additionalProperties: false
      required:
        - defendant_account_number
        - party_details
      properties:
        defendant_account_number:
          type: string
          maxLength: 20
          description: DB Mapping - defendant_accounts.account_number
        party_details:
          $ref: '#/components/schemas/TillsPartyDetails'

    TillsPartyDetails:
      type: object
      additionalProperties: false
      description: >
        Party details containing exactly one of individual_names or organisation_names. Individual names are
        provided when organisation_flag is false; organisation names are provided when organisation_flag is true.
      required:
        - organisation_flag
      properties:
        organisation_flag:
          type: boolean
          description: DB Mapping - parties.organisation
        individual_names:
          anyOf:
            - $ref: '#/components/schemas/TillsIndividualNames'
            - type: 'null'
        organisation_names:
          anyOf:
            - $ref: '#/components/schemas/TillsOrganisationNames'
            - type: 'null'

    TillsIndividualNames:
      type: object
      additionalProperties: false
      required:
        - forenames
        - surname
      properties:
        forenames:
          type: string
          maxLength: 50
          description: DB Mapping - parties.forenames
        surname:
          type: string
          maxLength: 50
          description: DB Mapping - parties.surname

    TillsOrganisationNames:
      type: object
      additionalProperties: false
      required:
        - organisation_name
      properties:
        organisation_name:
          type: string
          maxLength: 80
          description: DB Mapping - parties.organisation_name

    TillsPayerName:
      type: object
      additionalProperties: false
      properties:
        forenames:
          type:
            - string
            - 'null'
          description: Derived from parties.forenames via the associated Miscellaneous Account; legacy JSON fallback only without a durable association.
        surname:
          type:
            - string
            - 'null'
          description: Derived from parties.surname via the associated Miscellaneous Account; legacy JSON fallback only without a durable association.
        organisation_name:
          type:
            - string
            - 'null'
          description: Derived from parties.organisation_name via the associated Miscellaneous Account; legacy JSON fallback only without a durable association.

    InterfacePaymentAdditionalInformation:
      type: object
      additionalProperties: false
      description: JSON stored in payments_in.additional_information by p_int_payments_in.
      required:
        - interface_name
        - additional_information
      properties:
        interface_name:
          type: string
          description: Name of the interface job that produced the payment.
        additional_information:
          type: object
          additionalProperties: false
          required:
            - originator_reference
          properties:
            originator_reference:
              type: [ string, 'null' ]
              description: Incoming payment record reference; null when no reference was supplied.
