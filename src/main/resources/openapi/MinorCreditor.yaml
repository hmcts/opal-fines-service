openapi: 3.1.1

servers:
  - url: http://localhost:4550/

info:
  description: Opal Fines Service - Minor Creditor
  version: v0.0.1
  title: Opal Fines Service

paths:
  /minor-creditor-accounts/{id}:
    get:
      tags:
        - Minor Creditor
      summary: Get Minor Creditor Account
      description: The Get Minor Creditor Account will be used to return the low level data associated to the minor creditor account - such as personal details for the minor creditor, and payment details.
      operationId: getMinorCreditorAccount
      security:
        - permissions:
            - Search and View Accounts (in at least one business unit)
            - View Creditor BACS (in the business unit that the Minor Creditor Account belongs to)
      parameters:
        - in: path
          name: id
          description: DB Mapping - creditor_accounts.creditor_account_id
          schema:
            type: integer
            format: int64
          required: true
      responses:
        '200':
          description: OK
          headers:
            ETag:
              description: Version of the minor creditor account. DB Mapping - creditor_accounts.version
              schema:
                $ref: "./types.yaml#/components/schemas/BigInt"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/minorCreditorAccountResponse"
        400:
          description: Bad request
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        401:
          description: Unauthorized
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        403:
          description: Forbidden
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        500:
          description: Internal server error
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        503:
          description: Service unavailable
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
    patch:
      tags:
        - Minor Creditor
      summary: Update Minor Creditor Account
      description: The Update Minor Creditor Account will be used to update individual attributes of a Minor Creditor Account.
      operationId: patchMinorCreditorAccount
      security:
        - permissions:
            - Add and Remove payment hold (in the business unit supplied in Business-Unit-Id)
            - Account Maintenance (in the business unit supplied in Business-Unit-Id)
            - View Creditor BACS (in the business unit supplied in Business-Unit-Id)
      parameters:
        - in: path
          name: id
          description: DB Mapping - creditor_accounts.creditor_account_id
          schema:
            type: integer
            format: int64
          required: true
        - in: header
          name: If-Match
          description: Version of the minor creditor account. DB Mapping - creditor_accounts.version
          schema:
            type: string
        - in: header
          name: Business-Unit-Id
          description: Business unit identifier
          schema:
            type: string
          required: true
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              type: object
              required:
                - party_details
                - address
                - payment
              properties:
                party_details:
                  $ref: './common.yaml#/components/schemas/partyDetails'
                address:
                  $ref: './common.yaml#/components/schemas/addressDetails'
                payment:
                  $ref: './common.yaml#/components/schemas/creditorAccountPaymentDetails'
      responses:
        '200':
          description: OK
          headers:
            ETag:
              description: Version of the minor creditor account. DB Mapping - creditor_accounts.version
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/minorCreditorAccountResponse"
        400:
          description: Bad request
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        401:
          description: Unauthorized
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        403:
          description: Forbidden
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        500:
          description: Internal server error
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        503:
          description: Service unavailable
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'

  /minor-creditor-accounts/{id}/history:
    get:
      tags:
        - Minor Creditor
      summary: Get Minor Creditor History
      description: The Get Minor Creditor History API will be used to return history items, representing a chronology of activity on the account - ordered from latest to oldest.
      operationId: getMinorCreditorHistory
      security:
        - permissions:
            - Search and View Accounts (in at least one business unit)
      parameters:
        - in: path
          name: id
          schema:
            type: integer
            format: int64
          required: true
        - in: query
          name: dateFrom
          description: Optional date parameter to filter history items from a specific date.
          schema:
            type: string
            format: date
        - in: query
          name: dateTo
          description: Optional date parameter to filter history items up to a specific date.
          schema:
            type: string
            format: date
        - in: query
          name: itemTypes
          description: Optional comma-separated list of history item types to filter by.
          schema:
            type: array
            items:
              type: string
              enum:
                - amendment
                - financial
                - note
            style: form
            explode: false
      responses:
        '200':
          description: OK
          headers:
            ETag:
              $ref: './common.yaml#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - historyItems
                properties:
                  historyItems:
                    type: array
                    items:
                      $ref: './history.yaml#/components/schemas/minorCreditorHistoryItem'
        400:
          description: Bad request
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        401:
          description: Unauthorized
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        403:
          description: Forbidden
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        404:
          description: Not Found
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        408:
          description: Request timeout
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        500:
          description: Internal server error
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        503:
          description: Service unavailable
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'

  /minor-creditor-accounts/{id}/at-a-glance:
    get:
      tags:
        - Minor Creditor
      summary: Get Minor Creditor Account At A Glance
      description: Returns the minor creditor account, defendant and payment details required for the at-a-glance view.
      operationId: getMinorCreditorAccountAtAGlance
      security:
        - permissions:
            - Search and View Accounts (in at least one business unit)
            - View Creditor BACS (in at least one business unit)
      parameters:
        - in: path
          name: id
          description: DB Mapping - creditor_accounts.creditor_account_id
          schema:
            type: integer
            format: int64
          required: true
      responses:
        '200':
          description: OK
          headers:
            ETag:
              $ref: './common.yaml#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MinorCreditorAccountAtAGlanceResponse'
        '400':
          description: Bad request
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        '401':
          description: Unauthorized
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        '403':
          description: Forbidden
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        '404':
          description: Not found
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        '500':
          description: Internal server error
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        '503':
          description: Service unavailable
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'

  /minor-creditor-accounts/search:
    post:
      tags:
        - Minor Creditor
      summary: Search minor creditors
      description: Searches minor creditors based upon criteria in request body.
      operationId: postMinorCreditorSearch
      security:
        - permissions:
            - Search and View Accounts (in any Business Unit).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MinorCreditorSearchRequest'
      responses:
        200:
          description: 'OK'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MinorCreditorAccountsSearchResponse'
        400:
          description: 'Bad request'
          content:
            application/problem+json:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        401:
          description: 'Unauthorized'
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        403:
          description: 'Forbidden'
          content:
            application/problem+json:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        404:
          description: 'Not found'
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        422:
          description: 'Unprocessable content'
          content:
            application/problem+json:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        500:
          description: 'Internal server error'
          content:
            application/problem+json:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        503:
          description: 'Service unavailable'
          content:
            application/problem+json:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'

  /minor-creditor-accounts/{id}/header-summary:
    get:
      tags:
        - Minor Creditor
      summary: Get Minor Creditor accounter heder summary
      description: Gets Minor Creditor account header summary for the given Minor Creditor ID
      operationId: getMinorCreditorAccountHeaderSummary
      security:
        - permissions:
            - Search and View Accounts (in at least one business unit)
            - View Creditor BACS (in at least one business unit)
      parameters:
        - in: path
          name: id
          schema:
            type: integer
            format: int64
          required: true
      responses:
        200:
          description: OK
          headers:
            ETag:
              $ref: './common.yaml#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MinorCreditorAccountHeaderSummaryResponse'
        400:
          description: Bad request
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        401:
          description: Unauthorized
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        403:
          description: Forbidden
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        404:
          description: Not Found
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        408:
          description: Request timeout
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        500:
          description: Internal server error
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        503:
          description: Service unavailable
          content:
            application/json+problem:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'



components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    MinorCreditorAccountAtAGlanceResponse:
      additionalProperties: false
      type: object
      x-json-include: NON_NULL
      x-versioned: true
      x-implements:
        - uk.gov.hmcts.opal.dto.ToJsonString
        - uk.gov.hmcts.opal.util.Versioned
      required:
        - party
        - address
        - creditor_account_id
      properties:
        party:
          $ref: './CommonStrict.yaml#/components/schemas/partyDetails'
        address:
          $ref: './CommonStrict.yaml#/components/schemas/addressDetails'
        creditor_account_id:
          $ref: './types.yaml#/components/schemas/BigInt'
        defendant:
          $ref: '#/components/schemas/MinorCreditorAtAGlanceDefendant'
        payment:
          $ref: '#/components/schemas/MinorCreditorAtAGlancePayment'
    MinorCreditorAtAGlanceDefendant:
      type: object
      properties:
        account_number:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 10
        account_id:
          type:
            - integer
            - 'null'
          format: int64
        title:
          type:
            - string
            - 'null'
        forenames:
          type:
            - string
            - 'null'
        surname:
          type: string
    MinorCreditorAtAGlancePayment:
      type: object
      properties:
        is_bacs:
          type: boolean
        hold_payment:
          type: boolean
      required:
        - is_bacs
        - hold_payment
    minorCreditorAccountResponse:
      additionalProperties: false
      type: object
      required:
        - creditor_account_id
        - party_details
        - address
        - repayment
        - payment
      properties:
        creditor_account_id:
          $ref: "./types.yaml#/components/schemas/BigInt"
        party_details:
          $ref: './common.yaml#/components/schemas/partyDetails'
        address:
          $ref: './common.yaml#/components/schemas/addressDetails'
        repayment:
          type: boolean
          description: DB Mapping - creditor_accounts.repayment
        payment:
          allOf:
            - $ref: './common.yaml#/components/schemas/creditorAccountPaymentDetails'
            - properties:
                hold_payment:
                  type: boolean
                  description: DB Mapping - creditor_accounts.hold_payout
              required:
                - hold_payment
    MinorCreditorSearchRequest:
      title: Post Minor Creditor Accounts Search Request
      type: object
      additionalProperties: false
      description: |
        Search request criteria for minor creditor accounts.
        If account_number is populated, no other search fields may be populated.
        If creditor forenames is populated then last name must also be populated.
      allOf:
        - required:
            - active_accounts_only
        - oneOf:
            - required:
                - account_number
            - required:
                - creditor
      properties:
        active_accounts_only:
          type: boolean
        business_unit_ids:
          type: array
          nullable: true
          minItems: 1
          items:
            type: integer
            format: int16
        account_number:
          type: string
          nullable: true
        creditor:
          $ref: '#/components/schemas/MinorCreditorAccountSearchCreditor'
          nullable: true
    MinorCreditorAccountsSearchResponse:
      title: Post Minor Creditor Accounts Search Response
      type: object
      additionalProperties: false
      required:
        - count
        - creditor_accounts
      properties:
        count:
          type: integer
          format: The total number of records identified
        creditor_accounts:
          type: array
          nullable: true
          description: A list of minor creditor accounts. Null if none are found
          items:
            $ref: '#/components/schemas/minorCreditorAccountSearchResult'
    MinorCreditorAccountSearchCreditor:
      title: Minor Creditor Account Search Creditor
      type: object
      nullable: true
      additionalProperties: false
      description: |
        Search criteria used to identify a minor creditor, either an organisation or an individual
      required:
        - organisation
      properties:
        address_line_1:
          type: string
          nullable: true
        postcode:
          type: string
          nullable: true
        organisation:
          type: boolean
        organisation_name:
          type: string
          nullable: true
        exact_match_organisation_name:
          type: boolean
          nullable: true
        surname:
          type: string
          nullable: true
        forenames:
          type: string
          nullable: true
        exact_match_surname:
          type: boolean
          nullable: true
        exact_match_forenames:
          type: boolean
          nullable: true
    minorCreditorAccountSearchResult:
      title: Minor Creditor Account Search Result
      type: object
      additionalProperties: false
      description: Details of the defendant, which can be either an organisation or an individual
      required:
        - creditor_account_id
        - account_number
        - organisation
        - address_line_1
        - postcode
        - business_unit_name
        - business_unit_id
        - account_balance
        - organisation_name
        - surname
        - firstnames
        - defendant
      properties:
        creditor_account_id:
          type: string
        account_number:
          type: string
        organisation:
          type: boolean
        address_line_1:
          type: string
        postcode:
          type: string
          nullable: true
        business_unit_name:
          type: string
        business_unit_id:
          type: string
        account_balance:
          $ref: './types.yaml#/components/schemas/monetaryNegativeOrPositive'
        organisation_name:
          type: string
          nullable: true
        surname:
          type: string
          nullable: true
        firstnames:
          type: string
          nullable: true
        defendant:
          $ref: '#/components/schemas/MinorCreditorAccountSearchDefendant'
          nullable: true
    MinorCreditorAccountSearchDefendant:
      title: Minor Creditor Account Search Defendant
      type: object
      additionalProperties: false
      required:
        - defendant_account_id
        - organisation
        - organisation_name
        - surname
        - firstnames
      properties:
        defendant_account_id:
          type: string
        organisation:
          type: boolean
        organisation_name:
          type: string
          nullable: true
        surname:
          type: string
          nullable: true
        firstnames:
          type: string
          nullable: true

    MinorCreditorAccountHeaderSummaryResponse:
      additionalProperties: false
      type: object
      x-json-include: NON_NULL
      x-versioned: true
      x-implements:
        - uk.gov.hmcts.opal.dto.ToJsonString
        - uk.gov.hmcts.opal.util.Versioned
      required:
        - party_details
        - business_unit
        - creditor
        - financials
      properties:
        party_details:
          $ref: './common.yaml#/components/schemas/partyDetails'
        business_unit:
          $ref: './common.yaml#/components/schemas/businessUnitSummary'
        creditor:
          additionalProperties: false
          type: object
          x-json-include: NON_NULL
          required:
            - account_id
            - account_number
            - account_type
            - account_version
            - has_associated_defendant
          properties:
            account_id:
              $ref: './types.yaml#/components/schemas/BigInt'
            account_number:
              type: string
              maxLength: 20
            account_type:
              type: string
              description: DB Mapping - creditor_accounts.creditor_account_type
              enum:
                - MN
                - MJ
                - CF
            account_version:
              $ref: './types.yaml#/components/schemas/BigInt'
            has_associated_defendant:
              type: boolean
        financials:
          additionalProperties: false
          type: object
          x-json-include: NON_NULL
          required:
            - awarded
            - paid_out
            - awaiting_payout
            - outstanding
          properties:
            awarded:
              $ref: './types.yaml#/components/schemas/monetaryZeroOrPositive'
            paid_out:
              $ref: './types.yaml#/components/schemas/monetaryZeroOrPositive'
            awaiting_payout:
              $ref: './types.yaml#/components/schemas/monetaryZeroOrPositive'
            outstanding:
              $ref: './types.yaml#/components/schemas/monetaryZeroOrPositive'