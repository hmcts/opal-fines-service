services:
  opal-fines-service:
    image: opal-fines-service:local
    build:
      context: ../opal-fines-service
      args:
        - http_proxy
        - https_proxy
        - no_proxy
    environment:
      JAVA_TOOL_OPTIONS: >-
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    ports:
      - "127.0.0.1:5005:5005"
